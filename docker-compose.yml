services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blastradius
      POSTGRES_USER: blastradius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blastradius -d blastradius"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://blastradius:${POSTGRES_PASSWORD}@db:5432/blastradius
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
